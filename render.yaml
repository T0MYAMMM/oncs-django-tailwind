services:
  - type: web
    name: rocket-django-pro-latest
    plan: free
    env: python
    region: frankfurt  
    buildCommand: "./build.sh"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
